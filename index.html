<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>فتح الدكتور</title>
    <style>
      body {
        font-family: 'Cairo', Arial, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
        background: #f7f7fa;
        color: #222;
      }
      .container {
        text-align: center;
        background: #fff;
        padding: 2.5em 2em;
        border-radius: 18px;
        box-shadow: 0 4px 24px 0 rgba(0,0,0,0.07);
      }
      .spinner {
        border: 6px solid #e9e9ef;
        border-top: 6px solid #3fae5a;
        border-radius: 50%;
        width: 48px;
        height: 48px;
        animation: spin 1.1s linear infinite;
        margin: 1.5em auto 1em;
      }
      @keyframes spin {
        0% { transform: rotate(0deg);}
        100% { transform: rotate(360deg);}
      }
      .fallback-links {
        margin-top: 1.4em;
        font-size: 1.1em;
      }
      .fallback-links a {
        color: #3fae5a;
        text-decoration: none;
      }
    </style>
    <script>
      function openApp() {
        const doctorCode = window.location.pathname.split("/").pop();
        const deepLink = `mzn://doctor/${doctorCode}`;
        window.location = deepLink;

        setTimeout(function () {
          // Only show fallback links if app is not opened
          document.getElementById('fallback').style.display = 'block';
        }, 2000);
      }

      window.onload = openApp;
    </script>
  </head>
  <body>
    <div class="container">
      <div class="spinner"></div>
      <h2>جاري الفتح...</h2>
      <div id="fallback" class="fallback-links" style="display:none;">
        <p>لم يتم الفتح؟ يمكنك تنزيل التطبيق:</p>
        <p>
          <span id="android-link" style="display:none;">
            <a href="https://play.google.com/store/apps/details?id=com.mzn.patients" target="_blank">تحميل للأندرويد</a>
          </span>
          <span id="ios-link" style="display:none;">
            <a href="https://apps.apple.com/app/id6739300717" target="_blank">تحميل للآيفون</a>
          </span>
        </p>
      </div>
    </div>
    <script>
      // Show only relevant store link
      function showStoreLinks() {
        if (/android/i.test(navigator.userAgent)) {
          document.getElementById('android-link').style.display = 'inline';
        } else if (/iphone|ipad/i.test(navigator.userAgent)) {
          document.getElementById('ios-link').style.display = 'inline';
        } else {
          // Show both if unknown device
          document.getElementById('android-link').style.display = 'inline';
          document.getElementById('ios-link').style.display = 'inline';
        }
      }
      showStoreLinks();
    </script>
  </body>
</html>
