<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إدارة أكواد الأطباء - Shoaa Telemedicine</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      padding: 40px;
      animation: fadeIn 0.5s;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    h1 {
      text-align: center;
      color: #667eea;
      font-size: 2.5em;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
      font-size: 1.1em;
    }
    
    .message {
      padding: 15px;
      border-radius: 10px;
      text-align: center;
      font-weight: bold;
      margin-bottom: 20px;
      display: none;
      animation: slideDown 0.3s;
    }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .message.success {
      background: #d4edda;
      color: #155724;
      border: 2px solid #c3e6cb;
    }
    
    .message.error {
      background: #f8d7da;
      color: #721c24;
      border: 2px solid #f5c6cb;
    }
    
    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
    }
    
    input {
      flex: 1;
      padding: 15px;
      font-size: 18px;
      border: 2px solid #667eea;
      border-radius: 10px;
      outline: none;
      transition: all 0.3s;
    }
    
    input:focus {
      border-color: #764ba2;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }
    
    button {
      padding: 15px 30px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }
    
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    .btn-add {
      background: #667eea;
      color: white;
    }
    
    .btn-add:hover:not(:disabled) {
      background: #5568d3;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }
    
    .btn-refresh {
      background: #6c757d;
      color: white;
      padding: 15px;
    }
    
    .btn-refresh:hover:not(:disabled) {
      background: #5a6268;
    }
    
    .btn-delete {
      background: #dc3545;
      color: white;
      padding: 8px 16px;
      font-size: 14px;
    }
    
    .btn-delete:hover:not(:disabled) {
      background: #c82333;
      transform: scale(1.05);
    }
    
    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20px;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(0,0,0,0.1);
    }
    
    thead {
      background: #667eea;
      color: white;
    }
    
    th {
      padding: 20px;
      font-size: 20px;
      text-align: center;
    }
    
    tbody tr {
      border-bottom: 1px solid #e9ecef;
      transition: all 0.3s;
    }
    
    tbody tr:hover {
      background: #f8f9fa;
      transform: scale(1.01);
    }
    
    td {
      padding: 20px;
      font-size: 18px;
      text-align: center;
    }
    
    .empty {
      padding: 60px;
      text-align: center;
      color: #6c757d;
      font-size: 20px;
    }
    
    .stats {
      display: flex;
      justify-content: center;
      gap: 40px;
      text-align: center;
      margin-top: 20px;
      padding: 20px;
      background: #f8f9fa;
      border-radius: 10px;
    }

    .stat-item {
      display: flex;
      flex-direction: column;
    }

    .stat-value {
      font-size: 36px;
      font-weight: bold;
      color: #667eea;
    }

    .stat-label {
      font-size: 14px;
      color: #666;
      margin-top: 5px;
    }
    
    .spinner {
      display: inline-block;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    .loading-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .loading-overlay.active {
      display: flex;
    }

    .loading-spinner {
      background: white;
      padding: 30px;
      border-radius: 15px;
      text-align: center;
    }

    .loading-spinner .spinner {
      font-size: 40px;
    }
  </style>
</head>
<body>
  <div class="loading-overlay" id="loadingOverlay">
    <div class="loading-spinner">
      <div class="spinner">🔄</div>
      <p style="margin-top: 10px;">جاري المعالجة...</p>
    </div>
  </div>

  <div class="container">
    <h1>🏥 إدارة أكواد الأطباء</h1>
    <p class="subtitle">Shoaa Telemedicine Doctors Management</p>
    
    <div id="message" class="message"></div>
    
    <div class="controls">
      <input 
        type="text" 
        id="doctorCode" 
        placeholder="أدخل كود الطبيب"
        onkeypress="if(event.key==='Enter') addDoctor()"
      >
      <button class="btn-add" onclick="addDoctor()" id="addBtn">
        ➕ إضافة
      </button>
      <button class="btn-refresh" onclick="loadDoctors()" id="refreshBtn">
        🔄
      </button>
    </div>
    
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>الكود</th>
          <th style="width: 150px;">الإجراء</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr>
          <td colspan="3" class="empty">جاري التحميل...</td>
        </tr>
      </tbody>
    </table>

    <div class="stats">
      <div class="stat-item">
        <div class="stat-value" id="totalCount">0</div>
        <div class="stat-label">إجمالي الأكواد</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="lastUpdate">-</div>
        <div class="stat-label">آخر تحديث</div>
      </div>
    </div>
  </div>

  <script>
    // ⭐ ضع رابط Cloudflare Worker هنا
    const API_URL = 'https://shoaa-telemedicine-doctors.nitco-mobile.workers.dev';
    
    let doctors = [];
    let loading = false;

    // تحميل البيانات عند فتح الصفحة
    loadDoctors();

    function showLoading(show) {
      const overlay = document.getElementById('loadingOverlay');
      if (show) {
        overlay.classList.add('active');
      } else {
        overlay.classList.remove('active');
      }
    }

    async function loadDoctors() {
      if (loading) return;
      loading = true;
      updateRefreshButton(true);
      
      try {
        const res = await fetch(API_URL);
        const data = await res.json();
        doctors = data.doctors || [];
        renderTable();
        updateLastUpdateTime();
      } catch (error) {
        showMessage('❌ خطأ في تحميل البيانات', 'error');
      }
      
      loading = false;
      updateRefreshButton(false);
    }

    function renderTable() {
      const tbody = document.getElementById('tableBody');
      const count = document.getElementById('totalCount');
      
      count.textContent = doctors.length;
      
      if (doctors.length === 0) {
        tbody.innerHTML = '<tr><td colspan="3" class="empty">لا توجد أكواد حالياً</td></tr>';
        return;
      }
      
      tbody.innerHTML = doctors.map((code, index) => `
        <tr>
          <td><strong>${index + 1}</strong></td>
          <td><strong style="color: #667eea; font-size: 20px;">${code}</strong></td>
          <td>
            <button class="btn-delete" onclick="deleteDoctor('${code}')">
              ❌ حذف
            </button>
          </td>
        </tr>
      `).join('');
    }

    async function addDoctor() {
      if (loading) return;
      
      const input = document.getElementById('doctorCode');
      const code = input.value.trim();
      
      if (!code) {
        showMessage('⚠️ من فضلك أدخل كود الطبيب', 'error');
        return;
      }
      
      if (doctors.includes(code)) {
        showMessage('⚠️ الكود موجود بالفعل', 'error');
        return;
      }
      
      loading = true;
      showLoading(true);
      
      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'add', code: code })
        });
        
        const result = await response.json();
        
        if (response.ok && result.success) {
          doctors = result.doctors;
          renderTable();
          input.value = '';
          showMessage('✅ تم إضافة الكود بنجاح', 'success');
          updateLastUpdateTime();
        } else {
          throw new Error(result.error || 'خطأ في الإضافة');
        }
      } catch (error) {
        showMessage('❌ خطأ: ' + error.message, 'error');
      }
      
      loading = false;
      showLoading(false);
    }

    async function deleteDoctor(code) {
      if (loading) return;
      
      if (!confirm(`هل تريد حذف الكود: ${code}؟`)) return;
      
      loading = true;
      showLoading(true);
      
      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'delete', code: code })
        });
        
        const result = await response.json();
        
        if (response.ok && result.success) {
          doctors = result.doctors;
          renderTable();
          showMessage('✅ تم حذف الكود بنجاح', 'success');
          updateLastUpdateTime();
        } else {
          throw new Error(result.error || 'خطأ في الحذف');
        }
      } catch (error) {
        showMessage('❌ خطأ: ' + error.message, 'error');
      }
      
      loading = false;
      showLoading(false);
    }

    function showMessage(msg, type) {
      const messageDiv = document.getElementById('message');
      messageDiv.textContent = msg;
      messageDiv.className = `message ${type}`;
      messageDiv.style.display = 'block';
      
      setTimeout(() => {
        messageDiv.style.display = 'none';
      }, 3000);
    }

    function updateRefreshButton(isLoading) {
      const btn = document.getElementById('refreshBtn');
      const addBtn = document.getElementById('addBtn');
      
      if (isLoading) {
        btn.innerHTML = '<span class="spinner">🔄</span>';
        btn.disabled = true;
        addBtn.disabled = true;
      } else {
        btn.innerHTML = '🔄';
        btn.disabled = false;
        addBtn.disabled = false;
      }
    }

    function updateLastUpdateTime() {
      const now = new Date();
      const timeStr = now.toLocaleTimeString('ar-EG', { 
        hour: '2-digit', 
        minute: '2-digit' 
      });
      document.getElementById('lastUpdate').textContent = timeStr;
    }
  </script>
</body>
</html>
