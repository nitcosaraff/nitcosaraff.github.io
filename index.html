<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>فتح تطبيق مزن</title>
    <style>
      body {
        font-family: 'Cairo', Arial, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
        background: #f7fafd;
        color: #222;
      }
      .container {
        text-align: center;
        background: #fff;
        padding: 2.5em 2em;
        border-radius: 18px;
        box-shadow: 0 4px 24px 0 rgba(20,140,177,0.07);
        border: 2px solid #148CB1;
      }
      .logo {
        font-size: 2.4em;
        color: #148CB1;
        margin-bottom: 0.2em;
        font-weight: bold;
        letter-spacing: 1px;
      }
      .open-btn {
        background: #148CB1;
        color: #fff;
        padding: 0.85em 2.4em;
        border: none;
        border-radius: 22px;
        font-size: 1.3em;
        cursor: pointer;
        margin-top: 1.4em;
        box-shadow: 0 2px 10px 0 rgba(20,140,177,0.09);
        transition: background 0.2s;
      }
      .open-btn:hover {
        background: #117295;
      }
      .fallback-links {
        margin-top: 1.6em;
        font-size: 1.1em;
      }
      .fallback-links a {
        color: #148CB1;
        text-decoration: none;
      }
      .dev-link {
        margin-top: 2.6em;
        font-size: 0.98em;
        color: #148CB1;
      }
      .dev-link a {
        color: #148CB1;
        text-decoration: underline;
      }
    </style>
    <script>
      function openMznApp() {
        const doctorCode = window.location.pathname.split("/").pop();
        const deepLink = `mzn://doctor/${doctorCode}`;
        window.location = deepLink;
        setTimeout(function () {
          document.getElementById('fallback').style.display = 'block';
        }, 1800);
      }
      window.onload = function() {
        // لا تفتح مباشر، خلي المستخدم يضغط الزر
        document.getElementById('open-btn').onclick = openMznApp;
      }
    </script>
  </head>
  <body>
    <div class="container">
      <div class="logo">مزن</div>
      <h2>فتح تطبيق مزن</h2>
      <button id="open-btn" class="open-btn">إفتح التطبيق الآن</button>
      <div id="fallback" class="fallback-links" style="display:none;">
        <p>لم يتم الفتح؟ يمكنك تنزيل التطبيق:</p>
        <p>
          <span id="android-link" style="display:none;">
            <a href="https://play.google.com/store/apps/details?id=com.mzn.patients" target="_blank">تحميل للأندرويد</a>
          </span>
          <span id="ios-link" style="display:none;">
            <a href="https://apps.apple.com/app/id6739300717" target="_blank">تحميل للآيفون</a>
          </span>
        </p>
      </div>
      <div class="dev-link">
        مطور بواسطة <a href="https://www.nitcotek.com/" target="_blank">نتكو</a>
      </div>
    </div>
    <script>
      // Show only relevant store link
      function showStoreLinks() {
        if (/android/i.test(navigator.userAgent)) {
          document.getElementById('android-link').style.display = 'inline';
        } else if (/iphone|ipad/i.test(navigator.userAgent)) {
          document.getElementById('ios-link').style.display = 'inline';
        } else {
          document.getElementById('android-link').style.display = 'inline';
          document.getElementById('ios-link').style.display = 'inline';
        }
      }
      showStoreLinks();
    </script>
  </body>
</html>
