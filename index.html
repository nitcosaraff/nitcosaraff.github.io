<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <title>إدارة أكواد الأطباء</title>
  <style>
    body { font-family: sans-serif; direction: rtl; text-align: center; margin: 40px; }
    input, button { padding: 8px; margin: 5px; font-size: 16px; }
    table { margin: 20px auto; border-collapse: collapse; width: 50%; }
    th, td { border: 1px solid #ccc; padding: 8px; }
    th { background: #f5f5f5; }
  </style>
</head>
<body>
  <h1>إدارة أكواد الأطباء</h1>

  <input id="doctorCode" type="text" placeholder="أدخل كود الطبيب">
  <button onclick="addDoctor()">➕ إضافة</button>

  <table>
    <thead>
      <tr><th>الكود</th><th>حذف</th></tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>

  <script>
    const owner = "USERNAME"; // 👈 ضع هنا اسم المستخدم في GitHub
    const repo = "REPO_NAME"; // 👈 ضع هنا اسم الريبو
    const path = "doctors.json";
    const token = "YOUR_GITHUB_TOKEN"; // 👈 ضع هنا التوكن (مؤقتًا للتجربة)

    async function getFile() {
      const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}`);
      const data = await res.json();
      const content = atob(data.content);
      return { content: JSON.parse(content), sha: data.sha };
    }

    async function updateFile(newContent, sha) {
      const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}`, {
        method: "PUT",
        headers: {
          "Authorization": `token ${token}`,
          "Content-Type": "application/json",
        },
        body: JSON.stringify({
          message: "update doctors list",
          content: btoa(JSON.stringify(newContent, null, 2)),
          sha: sha
        })
      });
      return await res.json();
    }

    async function loadDoctors() {
      const { content } = await getFile();
      const table = document.getElementById("tableBody");
      table.innerHTML = "";
      content.doctors.forEach(code => {
        const tr = document.createElement("tr");
        tr.innerHTML = `<td>${code}</td><td><button onclick="deleteDoctor('${code}')">❌ حذف</button></td>`;
        table.appendChild(tr);
      });
    }

    async function addDoctor() {
      const input = document.getElementById("doctorCode");
      const code = input.value.trim();
      if (!code) return alert("من فضلك أدخل كود الطبيب");
      const { content, sha } = await getFile();
      if (content.doctors.includes(code)) return alert("الكود موجود بالفعل");
      content.doctors.push(code);
      await updateFile(content, sha);
      input.value = "";
      alert("✅ تم إضافة الكود بنجاح");
      loadDoctors();
    }

    async function deleteDoctor(code) {
      const { content, sha } = await getFile();
      content.doctors = content.doctors.filter(c => c !== code);
      await updateFile(content, sha);
      alert("❌ تم حذف الكود");
      loadDoctors();
    }

    loadDoctors();
  </script>
</body>
</html>
