<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <title>إدارة قائمة الأطباء</title>
  <style>
    body { font-family: sans-serif; direction: rtl; padding: 20px; }
    input, button { margin: 5px; padding: 8px; }
  </style>
</head>
<body>
  <h2>إضافة أو حذف طبيب من القائمة</h2>
  <input id="doctorName" placeholder="اسم الطبيب" />
  <button onclick="addDoctor()">➕ إضافة</button>
  <button onclick="removeDoctor()">🗑️ حذف</button>
  <pre id="status"></pre>

  <script>
    const repo = "nitcosaraff/nitcosaraff.github.io";
    const api = `https://api.github.com/repos/${repo}/dispatches`;

    async function updateDoctors(action, name) {
      document.getElementById("status").textContent = "⏳ جاري التنفيذ...";
      try {
        const res = await fetch(`https://raw.githubusercontent.com/${repo}/main/doctors.json`);
        const data = await res.json();

        if (action === "add") data.doctors.push(name);
        else if (action === "remove") data.doctors = data.doctors.filter(d => d !== name);

        await fetch(api, {
          method: "POST",
          headers: {
            "Accept": "application/vnd.github.everest-preview+json",
            "Authorization": "token GITHUB_TOKEN_PLACEHOLDER", // مش مهم هنا، GitHub Actions بيستخدم التوكن السري
          },
          body: JSON.stringify({
            event_type: "update_doctors",
            client_payload: { data: JSON.stringify(data, null, 2) }
          })
        });

        document.getElementById("status").textContent = "✅ تم تحديث القائمة!";
      } catch (e) {
        document.getElementById("status").textContent = "❌ حدث خطأ: " + e.message;
      }
    }

    function addDoctor() {
      const name = document.getElementById("doctorName").value.trim();
      if (!name) return alert("اكتب اسم الطبيب أولاً");
      updateDoctors("add", name);
    }

    function removeDoctor() {
      const name = document.getElementById("doctorName").value.trim();
      if (!name) return alert("اكتب اسم الطبيب أولاً");
      updateDoctors("remove", name);
    }
  </script>
</body>
</html>
