<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إدارة أكواد الأطباء</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      padding: 40px;
    }
    
    h1 {
      text-align: center;
      color: #667eea;
      font-size: 2.5em;
      margin-bottom: 30px;
    }
    
    .message {
      padding: 15px;
      border-radius: 10px;
      text-align: center;
      font-weight: bold;
      margin-bottom: 20px;
      display: none;
    }
    
    .message.success {
      background: #d4edda;
      color: #155724;
      border: 2px solid #c3e6cb;
    }
    
    .message.error {
      background: #f8d7da;
      color: #721c24;
      border: 2px solid #f5c6cb;
    }
    
    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
    }
    
    input {
      flex: 1;
      padding: 15px;
      font-size: 18px;
      border: 2px solid #667eea;
      border-radius: 10px;
      outline: none;
      transition: all 0.3s;
    }
    
    input:focus {
      border-color: #764ba2;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }
    
    button {
      padding: 15px 30px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    .btn-add {
      background: #667eea;
      color: white;
    }
    
    .btn-add:hover:not(:disabled) {
      background: #5568d3;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }
    
    .btn-refresh {
      background: #6c757d;
      color: white;
      padding: 15px;
    }
    
    .btn-refresh:hover:not(:disabled) {
      background: #5a6268;
    }
    
    .btn-delete {
      background: #dc3545;
      color: white;
      padding: 8px 16px;
      font-size: 14px;
    }
    
    .btn-delete:hover:not(:disabled) {
      background: #c82333;
    }
    
    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20px;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(0,0,0,0.1);
    }
    
    thead {
      background: #667eea;
      color: white;
    }
    
    th {
      padding: 20px;
      font-size: 20px;
      text-align: center;
    }
    
    tbody tr {
      border-bottom: 1px solid #e9ecef;
      transition: all 0.3s;
    }
    
    tbody tr:hover {
      background: #f8f9fa;
    }
    
    td {
      padding: 20px;
      font-size: 18px;
      text-align: center;
    }
    
    .empty {
      padding: 60px;
      text-align: center;
      color: #6c757d;
      font-size: 20px;
    }
    
    .stats {
      text-align: center;
      font-size: 18px;
      color: #6c757d;
      margin-top: 20px;
    }
    
    .stats strong {
      color: #667eea;
      font-size: 24px;
    }
    
    .spinner {
      display: inline-block;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🏥 إدارة أكواد الأطباء</h1>
    
    <div id="message" class="message"></div>
    
    <div class="input-group">
      <input 
        type="text" 
        id="doctorCode" 
        placeholder="أدخل كود الطبيب"
        onkeypress="if(event.key==='Enter') addDoctor()"
      >
      <button class="btn-add" onclick="addDoctor()">
        ➕ إضافة
      </button>
      <button class="btn-refresh" onclick="loadDoctors()" id="refreshBtn">
        🔄
      </button>
    </div>
    
    <table>
      <thead>
        <tr>
          <th>الكود</th>
          <th style="width: 150px;">الإجراء</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr>
          <td colspan="2" class="empty">جاري التحميل...</td>
        </tr>
      </tbody>
    </table>
    
    <div class="stats">
      عدد الأطباء: <strong id="count">0</strong>
    </div>
  </div>

  <script>
    const owner = 'nitcosaraff';
    const repo = 'nitcosaraff.github.io';
    let doctors = [];
    let loading = false;

    // تحميل البيانات عند فتح الصفحة
    loadDoctors();

    async function loadDoctors() {
      if (loading) return;
      loading = true;
      updateRefreshButton();
      
      try {
        const res = await fetch('/.netlify/functions/get-doctors');
        const data = await res.json();
        doctors = data.doctors || [];
        renderTable();
      } catch (error) {
        showMessage('❌ خطأ في تحميل البيانات', 'error');
      }
      
      loading = false;
      updateRefreshButton();
    }

    function renderTable() {
      const tbody = document.getElementById('tableBody');
      const count = document.getElementById('count');
      
      count.textContent = doctors.length;
      
      if (doctors.length === 0) {
        tbody.innerHTML = '<tr><td colspan="2" class="empty">لا توجد أكواد حالياً</td></tr>';
        return;
      }
      
      tbody.innerHTML = doctors.map(code => `
        <tr>
          <td><strong>${code}</strong></td>
          <td>
            <button class="btn-delete" onclick="deleteDoctor('${code}')">
              ❌ حذف
            </button>
          </td>
        </tr>
      `).join('');
    }

    async function addDoctor() {
      if (loading) return;
      
      const input = document.getElementById('doctorCode');
      const code = input.value.trim();
      
      if (!code) {
        showMessage('⚠️ من فضلك أدخل كود الطبيب', 'error');
        return;
      }
      
      if (doctors.includes(code)) {
        showMessage('⚠️ الكود موجود بالفعل', 'error');
        return;
      }
      
      loading = true;
      
      try {
        const response = await fetch('/.netlify/functions/update-doctors', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'add', code: code })
        });
        
        if (response.ok) {
          doctors.push(code);
          renderTable();
          input.value = '';
          showMessage('✅ تم إضافة الكود بنجاح', 'success');
        } else {
          const error = await response.json();
          showMessage('❌ حدث خطأ: ' + (error.error || 'خطأ غير معروف'), 'error');
        }
      } catch (error) {
        showMessage('❌ خطأ في الاتصال بالخادم', 'error');
      }
      
      loading = false;
    }

    async function deleteDoctor(code) {
      if (loading) return;
      
      if (!confirm(`هل تريد حذف الكود: ${code}؟`)) return;
      
      loading = true;
      
      try {
        const response = await fetch('/.netlify/functions/update-doctors', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'delete', code: code })
        });
        
        if (response.ok) {
          doctors = doctors.filter(c => c !== code);
          renderTable();
          showMessage('✅ تم حذف الكود بنجاح', 'success');
        } else {
          const error = await response.json();
          showMessage('❌ حدث خطأ: ' + (error.error || 'خطأ غير معروف'), 'error');
        }
      } catch (error) {
        showMessage('❌ خطأ في الاتصال بالخادم', 'error');
      }
      
      loading = false;
    }

    function showMessage(msg, type) {
      const messageDiv = document.getElementById('message');
      messageDiv.textContent = msg;
      messageDiv.className = `message ${type}`;
      messageDiv.style.display = 'block';
      
      setTimeout(() => {
        messageDiv.style.display = 'none';
      }, 3000);
    }

    function updateRefreshButton() {
      const btn = document.getElementById('refreshBtn');
      if (loading) {
        btn.innerHTML = '<span class="spinner">🔄</span>';
        btn.disabled = true;
      } else {
        btn.innerHTML = '🔄';
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
