<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بوابة خدمات شعاع - Shoaa Telemedicine</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 1. قسم تسجيل الدخول -->
  <div class="container narrow" id="loginView">
    <h1>🔐 تسجيل الدخول</h1>
    <p class="subtitle">بوابة إدارة خدمات التطبيق</p>

    <div id="loginMessage" class="message error"></div>

    <div class="form-group">
      <label for="phoneInput">رقم الهاتف / المعرف</label>
      <input type="text" id="phoneInput" placeholder="أدخل الرقم" onkeypress="if(event.key==='Enter') handleLogin()">
    </div>

    <div class="form-group">
      <label for="passwordInput">كلمة المرور</label>
      <input type="password" id="passwordInput" placeholder="أدخل كلمة المرور" onkeypress="if(event.key==='Enter') handleLogin()">
    </div>

    <button class="btn-primary" onclick="handleLogin()">دخول للنظام</button>
  </div>

  <!-- 2. قسم لوحة الخدمات (يظهر بعد تسجيل الدخول) -->
  <div class="container hidden" id="dashboardView">
    <div class="top-bar">
      <span style="font-weight: bold; color: #667eea;">👋 مرحباً بك في لوحة التحكم</span>
      <button class="btn-nav btn-logout" onclick="logout()">🚪 تسجيل خروج</button>
    </div>

    <h1>🏥 خدمات الطب الاتصالي</h1>
    <p class="subtitle">اختر الخدمة المطلوبة للمتابعة</p>

    <div class="services-grid">
      <a href="attendance.html" class="service-card">
        <div class="service-icon">📋</div>
        <div class="service-title">حضور الطب الاتصالي</div>
        <div class="service-desc">متابعة وسجلات حضور العيادات الاتصالية للمرضى والأطباء</div>
      </a>

      <a href="doctors.html" class="service-card">
        <div class="service-icon">👨‍⚕️</div>
        <div class="service-title">إدارة أكواد الأطباء</div>
        <div class="service-desc">إضافة وحذف واستعراض أكواد الأطباء المفعلين بالخدمة</div>
      </a>
    </div>
  </div>

  <script>
    const VALID_HASH = 'c88240559301e6b9f75fb5b63bc3fc35c690e537ef9a2e22999eb7250bc9d187';

    const loginView = document.getElementById('loginView');
    const dashboardView = document.getElementById('dashboardView');

    // التحقق من تطابق البصمة المحفوظة في الجلسة
    window.addEventListener('DOMContentLoaded', () => {
      if (sessionStorage.getItem('shoaa_auth_token') === VALID_HASH) {
        showDashboard();
      }
    });

    // دالة التشفير باتجاه واحد (SHA-256)
    async function sha256(text) {
      const msgBuffer = new TextEncoder().encode(text);
      const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function handleLogin() {
      const phone = document.getElementById('phoneInput').value.trim();
      const pass = document.getElementById('passwordInput').value.trim();
      const msgDiv = document.getElementById('loginMessage');

      const inputHash = await sha256(`${phone}:${pass}`);

      if (inputHash === VALID_HASH) {
        sessionStorage.setItem('shoaa_auth_token', inputHash);
        msgDiv.style.display = 'none';
        showDashboard();
      } else {
        msgDiv.textContent = '❌ رقم الهاتف أو كلمة المرور غير صحيحة';
        msgDiv.style.display = 'block';
      }
    }

    function showDashboard() {
      loginView.classList.add('hidden');
      dashboardView.classList.remove('hidden');
    }

    function logout() {
      sessionStorage.removeItem('shoaa_auth_token');
      dashboardView.classList.add('hidden');
      loginView.classList.remove('hidden');
      document.getElementById('phoneInput').value = '';
      document.getElementById('passwordInput').value = '';
    }
  </script>
</body>
</html>
