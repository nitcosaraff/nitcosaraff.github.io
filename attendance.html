<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>حضور الطب الاتصالي - Shoaa Telemedicine</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .container.wide {
      max-width: 1150px;
    }
    .table-responsive {
      overflow-x: auto;
    }
    .badge {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: bold;
    }
    .badge-id {
      background: #eef2ff;
      color: #667eea;
    }
    .badge-yes {
      background: #d4edda;
      color: #155724;
    }
    .badge-no {
      background: #f8d7da;
      color: #721c24;
    }
    .time-cell {
      font-size: 14px;
      color: #555;
      direction: ltr;
      display: inline-block;
    }
  </style>
  <script>
    if (!sessionStorage.getItem('shoaa_worker_token')) {
      window.location.replace('index.html');
    }
  </script>
</head>
<body>

  <!-- شاشة التحميل -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="loading-spinner">
      <div class="spinner">🔄</div>
      <p style="margin-top: 10px;">جاري تحميل سجلات الحضور...</p>
    </div>
  </div>

  <div class="container wide">
    <div class="top-bar">
      <a href="index.html" class="btn-nav">➡️ رجوع للخدمات</a>
      <button class="btn-nav btn-logout" onclick="logout()">🚪 تسجيل خروج</button>
    </div>

    <h1>📋 حضور الطب الاتصالي</h1>
    <p class="subtitle">Shoaa Telemedicine Attendance Logs</p>

    <div id="message" class="message"></div>

    <!-- شريط البحث والتحديث -->
    <div class="controls">
      <input 
        type="text" 
        id="searchInput" 
        placeholder="🔍 ابحث برقم الموعد، كود المريض، أو كود الطبيب..."
        oninput="filterAttendance()"
      >
      <button class="btn-refresh" onclick="window.loadAttendance()" id="refreshBtn" title="تحديث البيانات">
        🔄
      </button>
    </div>

    <div class="table-responsive">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>رقم الموعد</th>
            <th>كود المريض</th>
            <th>حضور المريض</th>
            <th>وقت دخول المريض</th>
            <th>كود الطبيب</th>
            <th>حضور الطبيب</th>
            <th>وقت دخول الطبيب</th>
          </tr>
        </thead>
        <tbody id="attendanceBody">
          <tr>
            <td colspan="8" class="empty">جاري الاتصال بقاعدة البيانات...</td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- الإحصائيات -->
    <div class="stats">
      <div class="stat-item">
        <div class="stat-value" id="totalCount">0</div>
        <div class="stat-label">إجمالي المواعيد</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="bothAttendedCount">0</div>
        <div class="stat-label">مكتملة (حضر الطرفان)</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="lastUpdate">-</div>
        <div class="stat-label">آخر تحديث</div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, query, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // ⚠️ ضع بيانات Web App الخاصة بمشروع shoaa-app هنا
    const firebaseConfig = {
      apiKey: "AIzaSyD_ttU1JrTmzCbepZz1ETxvRIuzBmf8ABA",
      authDomain: "shoaa-app.firebaseapp.com",
      projectId: "shoaa-app",
      storageBucket: "shoaa-app.firebasestorage.app",
      messagingSenderId: "575616654662",
      appId: "1:575616654662:web:a0e352f2a7ec6713661947",
      measurementId: "G-VRXQVYYERD"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let allRecords = [];
    let isLoading = false;

    function formatTimestamp(ts) {
      if (!ts) return { text: '-', millis: 0 };
      try {
        const dateObj = typeof ts.toDate === 'function' ? ts.toDate() : new Date(ts.seconds * 1000);
        return {
          text: dateObj.toLocaleString('ar-EG', {
            year: 'numeric',
            month: 'short',
            day: 'numeric',
            hour: '2-digit',
            minute: '2-digit'
          }),
          millis: dateObj.getTime()
        };
      } catch (e) {
        return { text: '-', millis: 0 };
      }
    }

    async function loadAttendance() {
      if (isLoading) return;
      isLoading = true;
      setLoadingUI(true);

      try {
        // ملاحظة: إذا لم تعدل الـ Rules لـ 500، غير الرقم أدناه إلى 10 مؤقتاً للتجربة
        const q = query(collection(db, "appointment_attendance"), limit(500));
        const querySnapshot = await getDocs(q);
        allRecords = [];

        querySnapshot.forEach((doc) => {
          const data = doc.data();
          const pTime = formatTimestamp(data.patientJoinedAt);
          const dTime = formatTimestamp(data.doctorJoinedAt);

          allRecords.push({
            appointmentId: String(data.appointmentId || doc.id),
            patientCode: String(data.patientCode || '-'),
            patientAttended: data.patientAttended === true,
            patientJoinedText: pTime.text,
            doctorCode: String(data.doctorCode || '-'),
            doctorAttended: data.doctorAttended === true,
            doctorJoinedText: dTime.text,
            latestActivity: Math.max(pTime.millis, dTime.millis)
          });
        });

        // ترتيب تنازلي حسب أحدث وقت دخول (للمريض أو الطبيب)
        allRecords.sort((a, b) => b.latestActivity - a.latestActivity);

        filterAttendance();
        updateLastUpdateTime();
      } catch (error) {
        console.error("Firestore Error:", error);
        showMessage('❌ خطأ في التحميل: ' + (error.code || error.message), 'error');
        document.getElementById('attendanceBody').innerHTML = `
          <tr><td colspan="8" class="empty">تعذر تحميل البيانات (${error.code || error.message})</td></tr>
        `;
      }

      isLoading = false;
      setLoadingUI(false);
    }

    function renderTable(records) {
      const tbody = document.getElementById('attendanceBody');
      document.getElementById('totalCount').textContent = records.length;
      document.getElementById('bothAttendedCount').textContent = records.filter(
        r => r.patientAttended && r.doctorAttended
      ).length;

      if (records.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8" class="empty">لا توجد سجلات حضور حالياً</td></tr>';
        return;
      }

      tbody.innerHTML = records.map((rec, index) => `
        <tr>
          <td><strong>${index + 1}</strong></td>
          <td><span class="badge badge-id">${rec.appointmentId}</span></td>
          <td><strong>${rec.patientCode}</strong></td>
          <td>
            <span class="badge ${rec.patientAttended ? 'badge-yes' : 'badge-no'}">
              ${rec.patientAttended ? '✅ حضر' : '❌ لم يحضر'}
            </span>
          </td>
          <td><span class="time-cell">${rec.patientJoinedText}</span></td>
          <td><strong>${rec.doctorCode}</strong></td>
          <td>
            <span class="badge ${rec.doctorAttended ? 'badge-yes' : 'badge-no'}">
              ${rec.doctorAttended ? '✅ حضر' : '❌ لم يحضر'}
            </span>
          </td>
          <td><span class="time-cell">${rec.doctorJoinedText}</span></td>
        </tr>
      `).join('');
    }

    window.filterAttendance = function() {
      const q = document.getElementById('searchInput').value.trim().toLowerCase();
      if (!q) {
        renderTable(allRecords);
        return;
      }

      const filtered = allRecords.filter(item =>
        item.appointmentId.toLowerCase().includes(q) ||
        item.patientCode.toLowerCase().includes(q) ||
        item.doctorCode.toLowerCase().includes(q)
      );

      renderTable(filtered);
    };

    function setLoadingUI(loadingState) {
      const btn = document.getElementById('refreshBtn');
      const overlay = document.getElementById('loadingOverlay');

      if (loadingState) {
        btn.innerHTML = '<span class="spinner">🔄</span>';
        btn.disabled = true;
        overlay.classList.add('active');
      } else {
        btn.innerHTML = '🔄';
        btn.disabled = false;
        overlay.classList.remove('active');
      }
    }

    function showMessage(msg, type) {
      const messageDiv = document.getElementById('message');
      messageDiv.textContent = msg;
      messageDiv.className = `message ${type}`;
      messageDiv.style.display = 'block';
      setTimeout(() => { messageDiv.style.display = 'none'; }, 4000);
    }

    function updateLastUpdateTime() {
      const now = new Date();
      document.getElementById('lastUpdate').textContent = now.toLocaleTimeString('ar-EG', {
        hour: '2-digit',
        minute: '2-digit'
      });
    }

    window.logout = function() {
      sessionStorage.removeItem('shoaa_worker_token');
      window.location.replace('index.html');
    };

    window.loadAttendance = loadAttendance;

    loadAttendance();
  </script>
</body>
</html>
