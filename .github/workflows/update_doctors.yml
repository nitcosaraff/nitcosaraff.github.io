name: Update Doctors List
on:
  repository_dispatch:
    types: [update_doctors]
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Update doctors.json
        run: |
          # استقبال مصفوفة الأطباء من الـ payload
          NEW_DOCTORS_JSON='${{ toJson(github.event.client_payload.doctors) }}'
          
          # بناء ملف doctors.json الجديد: { "doctors": [...] }
          echo "$NEW_DOCTORS_JSON" | jq -n --argjson doctors_array "$(< /dev/stdin)" '{ doctors: $doctors_array }' > doctors.json
          
          # إعداد الـ git ورفع التغيير
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add doctors.json
          git commit -m "Action: Update doctors list"
          # يجب أن يكون لدى GITHUB_TOKEN الصلاحيات لعمل push (عادةً صلاحية 'contents: write')
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
