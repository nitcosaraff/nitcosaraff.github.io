<script>
  function getAmountFromQuery() {
    const params = new URLSearchParams(window.location.search);
    return params.get("amount") || "1.00";
  }

  window.addEventListener('load', function() {
    const AMOUNT = getAmountFromQuery();
    
    // ✅ دلوقتي الـ DOM موجود
    document.getElementById("amountText").innerText = AMOUNT;

    startPayment(AMOUNT);
  });

  async function startPayment(AMOUNT) {
    const btn = document.querySelector('.btn');
    const loader = document.getElementById('loader');
    const errorMsg = document.getElementById('errorMsg');

    btn.style.display = 'none';
    loader.style.display = 'block';
    errorMsg.style.display = 'none';

    try {
      const workerUrl = "https://neoleap-payment.nitco-mobile.workers.dev";
      const response = await fetch(workerUrl, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          amount: AMOUNT,
          customerInfo: "Client Test Transaction"
        })
      });

      const data = await response.json();

      if (data.success && data.redirectUrl) {
        window.location.href = data.redirectUrl;
      } else {
        throw new Error(data.error || "فشل الاتصال بالبوابة");
      }
    } catch (err) {
      loader.style.display = 'none';
      btn.style.display = 'block';
      errorMsg.style.display = 'block';
      errorMsg.innerText = "خطأ: " + err.message;
    }
  }
</script>
