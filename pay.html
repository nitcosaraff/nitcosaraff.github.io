<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fake Success</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
      width: 320px;
    }

    h1 {
      color: green;
      margin-bottom: 10px;
    }

    p {
      color: #555;
    }

    .loader {
      margin: 20px auto;
      border: 4px solid #eee;
      border-top: 4px solid green;
      border-radius: 50%;
      width: 35px;
      height: 35px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      100% {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>تم الدفع بنجاح</h1>

    <p>
      جاري تحويلك...
    </p>

    <div class="loader"></div>
  </div>

  <script>
    console.log("FAKE SUCCESS PAGE LOADED");

    setTimeout(() => {
      window.location.href =
        "https://nitcosaraff.github.io/payment-success.html";
    }, 2000);
  </script>

</body>
</html>
