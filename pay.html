<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام الدفع الآمن</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; padding: 50px; background-color: #f4f7f6; }
    .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: inline-block; max-width: 400px; width: 90%; }
    .loader { border: 4px solid #f3f3f3; border-top: 4px solid #007bff; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .status-text { color: #555; font-size: 18px; margin-bottom: 10px; }
    .error { color: #d9534f; font-weight: bold; margin-top: 15px; }
  </style>
</head>
<body>

  <div class="card">
    <div id="loading-area">
      <div class="status-text">جاري تحويلك لبوابة الدفع...</div>
      <div class="loader"></div>
    </div>
    <div id="error-message" class="error"></div>
  </div>

  <script>
    async function startPayment() {
      const errorDiv = document.getElementById("error-message");
      try {
        const response = await fetch("https://neoleap-payment.nitco-mobile.workers.dev", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            amount: "100.00", // المبلغ
            customerInfo: "Client_001"
          })
        });

        const data = await response.json();

        if (data.success && data.redirectUrl) {
          // النجاح: التحويل للبنك
          window.location.href = data.redirectUrl;
        } else {
          throw new Error(data.error || "فشل في تهيئة الطلب");
        }
      } catch (err) {
        document.getElementById("loading-area").style.display = "none";
        errorDiv.innerText = "خطأ: " + err.message;
      }
    }

    // ابدأ العملية عند تحميل الصفحة
    window.onload = startPayment;
  </script>
</body>
</html>
