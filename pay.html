<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>الدفع</title>
</head>
<body>
<h3>جاري تحويلك لبوابة الدفع...</h3>

<script>
fetch("https://neoleap-payment.nitco-mobile.workers.dev/", {
  method: "POST",
  headers: { "Content-Type": "application/json" },
  body: JSON.stringify({ amount: "1.00" })
})
.then(r => r.json())
.then(res => {
  console.log(res);

if (!res[0]?.result) {
  document.body.innerHTML = "فشل بدء عملية الدفع";
  console.error(res);
  return;
}

// result شكله: PaymentID:URL
const [paymentId, paymentUrl] = res[0].result.split(":");

// افتح صفحة الدفع مباشرة
window.location.href = paymentUrl;

</script>
</body>
</html>
