<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>Pay</title>
</head>
<body>
<h3>جاري تحويلك لصفحة الدفع...</h3>

<script>
fetch("https://neoleap-payment.nitco-mobile.workers.dev/init-payment", {
  method: "POST",
  headers: {
    "Content-Type": "application/json"
  },
  body: JSON.stringify({ amount: "1.00" })
})
.then(res => res.json())
.then(data => {
  if (!data[0] || !data[0].paymentId) {
    document.body.innerHTML = "فشل بدء عملية الدفع";
    console.error(data);
    return;
  }

  const paymentId = data[0].paymentId;

  window.location.href =
    "https://securepayments.alrajhibank.com.sa/pg/TranportalVbv.htm" +
    "?paymentId=" + paymentId +
    "&id=8NW1vFi2IJ6f5vb";
})
.catch(err => {
  console.error(err);
  document.body.innerHTML = "خطأ غير متوقع";
});
</script>
</body>
</html>
