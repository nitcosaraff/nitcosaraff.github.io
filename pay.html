<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>دفع آمن - تيست</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f7f6;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: white;
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      text-align: center;
      width: 100%;
      max-width: 400px;
    }
    .badge {
      display: inline-block;
      background: #fff3cd;
      color: #856404;
      border: 1px solid #ffc107;
      border-radius: 8px;
      padding: 5px 12px;
      font-size: 13px;
      margin-bottom: 14px;
    }
    .loader {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #004d7a;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
      display: none;
    }
    @keyframes spin {
      0%   { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .error-msg {
      color: red;
      margin-top: 15px;
      display: none;
    }
    .retry-btn {
      background-color: #004d7a;
      color: white;
      border: none;
      padding: 15px 30px;
      font-size: 18px;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      display: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">⚠️ تيست — سيتم خصم 5 ريال فقط</div>
    <h2>إتمام الدفع</h2>
    <p>المبلغ الفعلي: <strong><span id="amountText">5.00</span> SAR</strong></p>
    <div class="loader" id="loader"></div>
    <div class="error-msg" id="errorMsg"></div>
    <button class="retry-btn" id="retryBtn" onclick="startPayment('5.00')">
      إعادة المحاولة
    </button>
  </div>

  <script>
    window.addEventListener('load', function () {
      startPayment('5.00');
    });

    async function startPayment(amount) {
      const loader    = document.getElementById('loader');
      const errorMsg  = document.getElementById('errorMsg');
      const retryBtn  = document.getElementById('retryBtn');

      loader.style.display   = 'block';
      errorMsg.style.display = 'none';
      retryBtn.style.display = 'none';

      try {
        const response = await fetch(
          'https://neoleap-payment.nitco-mobile.workers.dev',
          {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              amount: amount,
              customerInfo: 'Test Transaction - 5 SAR'
            })
          }
        );

        const data = await response.json();

        if (data.success && data.redirectUrl) {
          window.location.href = data.redirectUrl;
        } else {
          throw new Error(data.error || 'فشل الاتصال بالبوابة');
        }
      } catch (err) {
        loader.style.display   = 'none';
        errorMsg.style.display = 'block';
        retryBtn.style.display = 'block';
        errorMsg.innerText = 'خطأ: ' + err.message;
      }
    }
  </script>
</body>
</html>
