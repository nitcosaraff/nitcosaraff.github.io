<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>الدفع</title>
</head>
<body>

<h3>جاري تحويلك لبوابة الدفع...</h3>

<script>
fetch("https://neoleap-payment.nitco-mobile.workers.dev/init-payment", {
  method: "POST",
  headers: {
    "Content-Type": "application/json"
  },
  body: JSON.stringify({ amount: "1.00" })
})
.then(function (r) {
  return r.json();
})
.then(function (res) {
  console.log(res);

  if (!res || !res[0] || !res[0].result) {
    document.body.innerHTML = "فشل بدء عملية الدفع";
    console.error(res);
    return;
  }

  var result = res[0].result;
  var firstColonIndex = result.indexOf(":");

  var paymentId = result.substring(0, firstColonIndex);
  var paymentUrl = result.substring(firstColonIndex + 1);

  console.log("PaymentID:", paymentId);
  console.log("Redirect URL:", paymentUrl);

  window.location.href = paymentUrl;
})
.catch(function (err) {
  console.error(err);
  document.body.innerHTML = "خطأ غير متوقع";
});
</script>

</body>
</html>
