<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>الدفع</title>
</head>
<body>

<h3>جاري تحويلك لبوابة الدفع...</h3>

<script>
(function () {

  fetch("https://neoleap-payment.nitco-mobile.workers.dev/init-payment", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ amount: "1.00" })
  })
  .then(function (response) {
    return response.json();
  })
  .then(function (res) {
    console.log(res);

    if (!res || !res[0] || !res[0].result) {
      document.body.innerHTML = "فشل بدء عملية الدفع";
      return;
    }

    var result = res[0].result;
    var splitIndex = result.indexOf(":");

    var paymentId = result.substring(0, splitIndex);
    var paymentUrl = result.substring(splitIndex + 1);

    console.log("PaymentID:", paymentId);
    console.log("URL:", paymentUrl);

    window.location.href = paymentUrl;
  })
  .catch(function (err) {
    console.error(err);
    document.body.innerHTML = "خطأ غير متوقع";
  });

})();
</script>

</body>
</html>
