<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>جاري التحويل للدفع</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding-top: 60px;
      background: #f9f9f9;
    }

    .loader {
      border: 4px solid #eee;
      border-top: 4px solid #1a73e8;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .error {
      color: #c62828;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <h3>جاري تحويلك إلى بوابة الدفع الآمنة…</h3>
  <div class="loader"></div>

  <div id="error" class="error"></div>

  <script>
    (async function startPayment() {
      const errorDiv = document.getElementById("error");

      try {
        const response = await fetch(
          "https://neoleap-payment.nitco-mobile.workers.dev",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              amount: "100.00",
              customerInfo: "Web User"
            })
          }
        );

        if (!response.ok) {
          throw new Error("HTTP Error: " + response.status);
        }

        const data = await response.json();
        console.log("Worker response:", data);

        if (data.success && data.redirectUrl) {
          // تحويل المستخدم لبوابة الدفع
          window.location.href = data.redirectUrl;
        } else {
          errorDiv.innerText =
            "فشل بدء عملية الدفع. " + (data.error || "");
        }

      } catch (err) {
        console.error(err);
        errorDiv.innerText =
          "حدث خطأ أثناء الاتصال بخدمة الدفع. حاول مرة أخرى.";
      }
    })();
  </script>

</body>
</html>
