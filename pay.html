<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>دفع آمن</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f7f6;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: white;
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      text-align: center;
      width: 100%;
      max-width: 400px;
    }
    .btn {
      background-color: #004d7a;
      color: white;
      border: none;
      padding: 15px 30px;
      font-size: 18px;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
    }
    .loader {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #004d7a;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
      display: none;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .error-msg {
      color: red;
      margin-top: 15px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>إتمام الدفع</h2>
    <p>المبلغ المطلوب: <strong><span id="amountText"></span> SAR</strong></p>
    <button class="btn">جاري التحميل...</button>
    <div class="loader" id="loader"></div>
    <div class="error-msg" id="errorMsg"></div>
  </div>

  <script>
    // تم تعديل الدالة لتعيد القيمة 5 دائماً وتجاهل أي قيمة في الرابط
    function getAmountFromQuery() {
      return "5.00"; 
    }

    window.addEventListener('load', function() {
      const AMOUNT = getAmountFromQuery();
      document.getElementById("amountText").innerText = AMOUNT;
      startPayment(AMOUNT);
    });

    async function startPayment(AMOUNT) {
      const btn = document.querySelector('.btn');
      const loader = document.getElementById('loader');
      const errorMsg = document.getElementById('errorMsg');

      btn.style.display = 'none';
      loader.style.display = 'block';
      errorMsg.style.display = 'none';

      try {
        const workerUrl = "https://neoleap-payment.nitco-mobile.workers.dev";
        const response = await fetch(workerUrl, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            amount: AMOUNT, // هنا سيتم إرسال "5.00" دائماً إلى السيرفر
            customerInfo: "Client Test Transaction"
          })
        });

        const data = await response.json();

        if (data.success && data.redirectUrl) {
          window.location.href = data.redirectUrl;
        } else {
          throw new Error(data.error || "فشل الاتصال بالبوابة");
        }
      } catch (err) {
        loader.style.display = 'none';
        btn.style.display = 'block';
        errorMsg.style.display = 'block';
        errorMsg.innerText = "خطأ: " + err.message;
      }
    }
  </script>
</body>
</html>
