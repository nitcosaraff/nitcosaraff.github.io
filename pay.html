<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>الدفع</title>
</head>
<body>

<h3>جاري تحويلك إلى بوابة الدفع الآمنة…</h3>

<script>
(async () => {
  try {
    const res = await fetch(
      "https://neoleap-payment.nitco-mobile.workers.dev/init-payment",
      {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ amount: "1.00" })
      }
    );

    const data = await res.json();
    console.log("Init payment response:", data);

    if (!data[0] || data[0].status !== "1") {
      document.body.innerHTML = "فشل بدء عملية الدفع";
      return;
    }

    const resultStr = data[0].result;

    // ✅ النتيجة دايمًا بالشكل:
    // paymentId:FULL_URL
    const parts = resultStr.split(":");

    // نرجّع كل حاجة بعد أول :
    const paymentUrl = parts.slice(1).join(":");

    console.log("Redirecting to:", paymentUrl);

    window.location.href = paymentUrl;

  } catch (e) {
    console.error(e);
    document.body.innerHTML = "خطأ في الاتصال";
  }
})();
</script>

</body>
</html>
