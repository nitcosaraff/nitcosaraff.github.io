<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>الدفع</title>
</head>
<body>
  <h3>جاري تحويلك إلى بوابة الدفع...</h3>

  <form
    id="pgForm"
    method="POST"
    enctype="application/x-www-form-urlencoded"
  >
  <input type="hidden" name="id">
  <input type="hidden" name="trandata">
  <input type="hidden" name="responseURL">
  <input type="hidden" name="errorURL">
  

  <script>
    fetch('https://neoleap-payment.nitco-mobile.workers.dev/create-payment', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ amount: "10.00" })
    })
    .then(res => res.json())
    .then(data => {
      const form = document.getElementById('pgForm');
      form.action = data.pgUrl;
      form.id.value = data.id;
      form.trandata.value = data.trandata;
      form.responseURL.value = data.responseURL;
      form.errorURL.value = data.errorURL;
      form.submit();
    })
    .catch(err => {
      document.body.innerHTML = 'خطأ في بدء عملية الدفع';
      console.error(err);
    });
  </script>
</body>
</html>
