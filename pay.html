<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>Pay</title>
</head>
<body>
<h3>جاري تحويلك للدفع...</h3>

<script>
fetch("https://neoleap-payment.nitco-mobile.workers.dev", {
  method: "POST",
  headers: { "Content-Type": "application/json" },
  body: JSON.stringify({ amount: "1.00" })
})
.then(r => r.json())
.then(res => {
  if (!res[0]?.paymentId) {
    document.body.innerHTML = "خطأ في بدء عملية الدفع";
    console.error(res);
    return;
  }

  const paymentId = res[0].paymentId;

  window.location.href =
    "https://securepayments.alrajhibank.com.sa/pg/TranportalVbv.htm" +
    "?paymentId=" + paymentId +
    "&id=8NW1vFi2IJ6f5vb";
});
</script>
</body>
</html>
