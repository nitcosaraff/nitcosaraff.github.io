<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>دفع آمن - تيست</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: #f4f7f6;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: white;
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      text-align: center;
      width: 90%;
      max-width: 380px;
    }
    h2 { color: #004d7a; margin-bottom: 8px; }
    .amount { font-size: 22px; font-weight: bold; color: #004d7a; margin: 12px 0; }
    .loader {
      border: 4px solid #f0f0f0;
      border-top: 4px solid #004d7a;
      border-radius: 50%;
      width: 40px; height: 40px;
      animation: spin 0.8s linear infinite;
      margin: 20px auto;
    }
    @keyframes spin {
      0%  { transform: rotate(0deg); }
      100%{ transform: rotate(360deg); }
    }
    .status { color: #555; font-size: 15px; margin-top: 10px; }
    .badge {
      display: inline-block;
      background: #fff3cd;
      color: #856404;
      border: 1px solid #ffc107;
      border-radius: 8px;
      padding: 6px 14px;
      font-size: 13px;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">⚠️ وضع التيست — لا يوجد دفع حقيقي</div>
    <h2>جاري معالجة الدفع</h2>
    <div class="amount" id="amountText"></div>
    <div class="loader"></div>
    <div class="status" id="statusText">جاري الاتصال بالبنك...</div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const amount = params.get("amount") || "70.00";
    document.getElementById("amountText").innerText = amount + " SAR";

    const steps = [
      { delay: 800,  msg: "جاري التحقق من البطاقة..." },
      { delay: 1600, msg: "جاري الخصم من الحساب..." },
      { delay: 2400, msg: "تم الدفع بنجاح ✓" },
    ];

    steps.forEach(({ delay, msg }) => {
      setTimeout(() => {
        document.getElementById("statusText").innerText = msg;
      }, delay);
    });

    // بعد 3 ثواني يعمل redirect لـ success
    setTimeout(() => {
      window.location.href = "https://nitcosaraff.github.io/payment-success.html";
    }, 3000);
  </script>
</body>
</html>
