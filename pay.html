<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>الدفع</title>
</head>
<body>

<h3>جاري تحويلك إلى بوابة الدفع...</h3>

<script>
(async () => {
  try {
    const res = await fetch(
      "https://neoleap-payment.nitco-mobile.workers.dev/init-payment",
      {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ amount: "1.00" })
      }
    );

    const data = await res.json();
    console.log("INIT RESPONSE:", data);

    if (data && data[0] && data[0].status === "1") {
      const result = data[0].result;

      const paymentUrl = result.substring(result.indexOf("http"));
      console.log("Redirecting to:", paymentUrl);

      window.location.href = paymentUrl;
    } else {
      document.body.innerHTML = "<h3>فشل بدء عملية الدفع</h3>";
    }
  } catch (e) {
    console.error(e);
    document.body.innerHTML = "<h3>خطأ في الاتصال</h3>";
  }
})();
</script>

</body>
</html>
