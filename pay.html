<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>تحويل للدفع</title>
</head>
<body>
    <div id="status">
        <h3>جاري تحويلك لبوابة الدفع...</h3>
    </div>

    <script>
    async function startPayment() {
        const statusDiv = document.getElementById("status");
        
        try {
            const response = await fetch("https://neoleap-payment.nitco-mobile.workers.dev/init-payment", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ amount: "1.00" })
            });

            const res = await response.json();
            console.log("Response:", res);

            // التحقق من صحة الاستجابة بناءً على الـ JSON الذي أرفقته
            if (res && res[0] && res[0].status === "1") {
                const result = res[0].result;
                const splitIndex = result.indexOf(":");
                const paymentUrl = result.substring(splitIndex + 1);

                console.log("Redirecting to:", paymentUrl);
                window.location.href = paymentUrl;
            } else {
                statusDiv.innerHTML = "<h3>فشل في تهيئة الدفع: " + (res[0]?.result || "خطأ غير معروف") + "</h3>";
            }
        } catch (err) {
            console.error("Error:", err);
            statusDiv.innerHTML = "<h3>حدث خطأ في الاتصال بالخادم</h3>";
        }
    }

    // تشغيل الدالة فور تحميل الصفحة
    startPayment();
    </script>
</body>
</html>
