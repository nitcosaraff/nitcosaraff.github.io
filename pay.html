<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة الدفع</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; padding-top: 100px; background-color: #f4f4f4; }
        .loader { border: 5px solid #f3f3f3; border-top: 5px solid #28a745; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .message { font-size: 18px; color: #555; }
    </style>
</head>
<body>

    <div id="loading-area">
        <div class="loader"></div>
        <p class="message">جاري الاتصال بالبنك الآمن...</p>
    </div>

    <script>
    (async function startPayment() {
        try {
            // طلب إنشاء عملية دفع من الـ Worker
            const response = await fetch("https://neoleap-payment.nitco-mobile.workers.dev/init-payment", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ amount: "1.00" })
            });

            const data = await response.json();
            console.log("Bank Response:", data);

            // التحقق من وجود رابط التوجيه
            if (data && data[0] && data[0].status === "1") {
                const resultStr = data[0].result;
                // استخراج الرابط بأمان (يأخذ كل شيء بعد أول http)
                const paymentUrl = resultStr.substring(resultStr.indexOf("http"));
                
                console.log("Redirecting to:", paymentUrl);
                window.location.href = paymentUrl;
            } else {
                document.body.innerHTML = "<h3 style='color:red'>فشل: " + (data[0]?.result || "خطأ غير معروف") + "</h3>";
            }

        } catch (error) {
            console.error("Error:", error);
            document.body.innerHTML = "<h3 style='color:red'>خطأ في الاتصال بالسيرفر</h3>";
        }
    })();
    </script>

</body>
</html>
