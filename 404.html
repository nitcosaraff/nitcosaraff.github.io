<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>مزن - تحميل التطبيق</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #148CB1;
      --primary-dark: #0e5c7d;
      --error: #e03c3c;
      --bg: #f7fafd;
      --card-bg: #fff;
      --shadow: 0 4px 32px 0 rgba(20,140,177,0.13);
      --radius: 20px;
    }
    body {
      background: var(--bg);
      color: #222;
      font-family: 'Cairo', Arial, sans-serif;
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.3s;
    }
    .container {
      background: var(--card-bg);
      padding: 2.7em 2.1em 2.1em 2.1em;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 2px solid var(--primary);
      text-align: center;
      max-width: 370px;
      width: 100%;
      position: relative;
      overflow: hidden;
      animation: fadein 0.7s;
    }
    @keyframes fadein {
      from { opacity: 0; transform: translateY(40px);}
      to { opacity: 1; transform: translateY(0);}
    }
    .error-badge {
      position: absolute;
      top: -28px;
      right: 50%;
      transform: translateX(50%);
      background: var(--error);
      color: #fff;
      padding: 0.52em 2.1em;
      border-radius: 24px;
      font-size: 1.06em;
      font-weight: 700;
      box-shadow: 0 2px 16px 0 rgba(224,60,60,0.12);
      letter-spacing: 1px;
      z-index: 2;
      user-select: none;
      border: 2px solid #fff;
    }
    .logo {
      font-size: 2.6em;
      color: var(--primary);
      margin-bottom: 0.1em;
      margin-top: 0.2em;
      font-weight: bold;
      letter-spacing: 1.5px;
      user-select: none;
      transition: color 0.2s;
    }
    .not-found-text {
      font-size: 1.24em;
      color: var(--primary);
      margin-top: 0.65em;
      margin-bottom: 1.13em;
      font-weight: 700;
      letter-spacing: 0.4px;
      user-select: none;
    }
    .icon {
      width: 67px;
      height: 67px;
      margin: 0 auto 0.7em auto;
      display: block;
      border-radius: 50%;
      background: linear-gradient(135deg, #e0f4fa 40%, #bde1ef 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 12px 0 rgba(20,140,177,0.10);
      animation: popin 0.7s;
    }
    @keyframes popin {
      from { opacity: 0; transform: scale(0.7);}
      to { opacity: 1; transform: scale(1);}
    }
    .icon svg {
      width: 38px;
      height: 38px;
      color: var(--primary);
      display: block;
      margin: auto;
    }
    .description {
      font-size: 1.12em;
      color: #3f3f3f;
      margin-bottom: 1.5em;
      margin-top: 0.4em;
      line-height: 1.7;
      user-select: none;
      letter-spacing: 0.1px;
    }
    .store-link {
      display: inline-block;
      padding: 0.95em 2.35em;
      background: linear-gradient(90deg, var(--primary) 60%, var(--primary-dark) 100%);
      color: #fff;
      border-radius: 50px;
      text-decoration: none;
      font-weight: 700;
      font-size: 1.13em;
      margin-bottom: 1.3em;
      transition: background 0.18s, transform 0.12s;
      cursor: pointer;
      border: none;
      outline: none;
      box-shadow: 0 2px 8px 0 rgba(20,140,177,0.07);
      letter-spacing: 0.5px;
    }
    .store-link:hover {
      background: linear-gradient(90deg, var(--primary-dark) 40%, var(--primary) 100%);
      transform: translateY(-2px) scale(1.04);
    }
    .dev-link {
      margin-top: 2.1em;
      font-size: 0.97em;
      color: var(--primary);
      letter-spacing: 0.2px;
      opacity: 0.95;
    }
    .dev-link a {
      color: var(--primary);
      text-decoration: underline;
      transition: color 0.15s;
    }
    .dev-link a:hover {
      color: var(--primary-dark);
    }

    @media (max-width: 480px) {
      .container {
        max-width: 97vw;
        padding: 1.5em 0.7em 1.1em 0.7em;
      }
      .logo { font-size: 2.1em;}
      .icon { width: 48px; height: 48px;}
      .icon svg { width: 26px; height: 26px;}
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">مزن</div>
    <div class="not-found-text">هذه الصفحة غير موجودة</div>
    <div class="description">
      يمكنك تحميل التطبيق من المتجر
    </div>
    <a class="store-link" id="storeBtn" href="#">تحميل التطبيق</a>
    <div class="dev-link">
      تطوير بواسطة <a href="https://www.nitcotek.com/" target="_blank" rel="noopener">نتكو</a>
    </div>
  </div>
  <script>
    function getStoreLink() {
      var userAgent = navigator.userAgent || navigator.vendor || window.opera;
      if (/android/i.test(userAgent)) {
        return "https://play.google.com/store/apps/details?id=com.mzn.patients";
      } else if (/iPad|iPhone|iPod/.test(userAgent)) {
        return "https://apps.apple.com/app/id6739300717";
      } else {
        // افتراضيًا على متجر Google Play
        return "https://play.google.com/store/apps/details?id=com.mzn.patients";
      }
    }
    document.getElementById("storeBtn").onclick = function(e) {
      e.preventDefault();
      window.location = getStoreLink();
    };
  </script>
</body>
</html>
